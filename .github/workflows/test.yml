name: IntTest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

jobs:
  db-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'

      - name: Build
        run: make bin

      - name: Migration integration tests
        run: go test -v ./internal/migration ./cmd/mf-importer
        env:
          MF_MIGRATION_TEST_DSN: "root:password@tcp(127.0.0.1:3306)/?parseTime=true"

      - name: Embedded CLI outside the source directory
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/build/bin/mf-importer" migrate up
          "$GITHUB_WORKSPACE/build/bin/mf-importer" migrate up
          "$GITHUB_WORKSPACE/build/bin/mf-importer" migrate down --limit 0
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: mfimporter
          DB_USER: root
          DB_PASS: password

      - name: Embedded SQL in the final image
        run: |
          docker build -t mf-importer-migration-test -f build/Dockerfile .
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_NAME=mfimporter -e DB_USER=root -e DB_PASS=password \
            mf-importer-migration-test migrate up

    services:
      mariadb:
        image: mariadb:11
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
        ports:
          - "3306:3306"
        env:
          MYSQL_DATABASE: mfimporter
          MYSQL_ROOT_PASSWORD: password
          TZ: Asia/Tokyo
