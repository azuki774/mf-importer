name: Document

on:
  push:
    branches:
      - main

jobs:
  doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tbls.yml
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: k1LoW/setup-tbls@5e8e69748c0bb15fdb5e51a0ecdb84f1ecd0e3a1 # v1.4.1
      - name: Wait for ready DB
        run: |
          until mysql -u root -ppassword -h 127.0.0.1 -e '\q'; do sleep 1; done
          echo "MariaDB is up!"
      - name: migration
        run: make migration
      - name: Run tbls for generate database document
        run: tbls doc

    services:
      db:
        image: mariadb:10.9
        ports:
          - 3306:3306
        env: 
          MYSQL_DATABASE: mfimporter
          MYSQL_ROOT_PASSWORD: password
          MYSQL_USER: user
          MYSQL_PASSWORD: pwd
          TZ: Asia/Tokyo
