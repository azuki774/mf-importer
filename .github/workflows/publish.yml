name: Build and Publish

on:
  push:
    branches:
      - master
    tags:
      - v*
    paths-ignore:
      - docs/**

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      importer: ${{ steps.filter.outputs.importer }}
      maw: ${{ steps.filter.outputs.maw }}
      api: ${{ steps.filter.outputs.api }}
      metrics: ${{ steps.filter.outputs.metrics }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: checkout
        if: github.ref_type == 'branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect image changes
        id: filter
        if: github.ref_type == 'branch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            importer:
              - '.dockerignore'
              - '.github/workflows/publish.yml'
              - 'build/Dockerfile'
              - 'cmd/mf-importer/**'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
            maw:
              - '.dockerignore'
              - '.github/workflows/publish.yml'
              - 'build/maw/Dockerfile'
              - 'cmd/mf-importer-maw/**'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
            api:
              - '.dockerignore'
              - '.github/workflows/publish.yml'
              - 'build/api/Dockerfile'
              - 'cmd/mf-importer-api/**'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
            metrics:
              - '.dockerignore'
              - '.github/workflows/publish.yml'
              - 'build/metrics/Dockerfile'
              - 'cmd/mf-importer-metrics/**'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
            frontend:
              - '.dockerignore'
              - '.github/workflows/publish.yml'
              - 'build/fe/Dockerfile'
              - 'frontend/**'

  build_and_push:
    needs: changes
    if: ${{ github.ref_type == 'tag' || needs.changes.outputs.importer == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: docker-image
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/azuki774/mf-importer
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha,format=short,prefix=,enable=${{ github.ref_type == 'branch' || github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_and_push_maw:
    needs: changes
    if: ${{ github.ref_type == 'tag' || needs.changes.outputs.maw == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/azuki774/mf-importer-maw
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha,format=short,prefix=,enable=${{ github.ref_type == 'branch' || github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./build/maw/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_and_push_api:
    needs: changes
    if: ${{ github.ref_type == 'tag' || needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/azuki774/mf-importer-api
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha,format=short,prefix=,enable=${{ github.ref_type == 'branch' || github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./build/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_and_push_metrics:
    needs: changes
    if: ${{ github.ref_type == 'tag' || needs.changes.outputs.metrics == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/azuki774/mf-importer-metrics
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha,format=short,prefix=,enable=${{ github.ref_type == 'branch' || github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./build/metrics/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_and_push_fe:
    needs: changes
    if: ${{ github.ref_type == 'tag' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/azuki774/mf-importer-fe
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha,format=short,prefix=,enable=${{ github.ref_type == 'branch' || github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
