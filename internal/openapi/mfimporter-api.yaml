openapi: 3.1.0
info:
  version: '1.0'
  title: mfimporter-api
  summary: ''
servers:
  - url: 'http://localhost:3000'
paths:
  /details:
    get:
      summary: get details
      operationId: get-details
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          description: 'sort key (useDate|name|price|registDate|importJudgeDate|importDate)'
          schema:
            type: string
            default: useDate
        - name: order
          in: query
          description: 'sort order (asc|desc)'
          schema:
            type: string
            default: desc
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Detail'
      servers:
        - url: 'http://localhost:3000'
  /details/count:
    get:
      summary: get details total count
      operationId: get-details-count
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailsCount'
      servers:
        - url: 'http://localhost:3000'
  /health:
    get:
      summary: health check
      operationId: get-health
      requestBody:
        content:
          text/plain:
            schema:
              type: string
              default: OK
              examples:
                - OK
            examples:
              default:
                value: OK
      responses: {}
      servers:
        - url: 'http://localhost:3000'
  '/details/{id}':
    get:
      summary: '[WIP] get detail'
      operationId: get-details-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
      servers:
        - url: 'http://localhost:3000'
    patch:
      summary: change status detail
      operationId: patch-details-id
      parameters:
        - name: ope
          in: query
          description: 'operate name ("reset": judge history reset)'
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content: {}
      responses:
        '200':
          description: OK
        '400':
          description: "Bad Request\r\nUnknown operate name"
      servers:
        - url: 'http://localhost:3000'
      x-internal: false
    delete:
      summary: '[WIP] delete detail'
      operationId: delete-details-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
      servers:
        - url: 'http://localhost:3000'
  /histories:
    get:
      summary: '[WIP] get import hisories'
      operationId: get-histories
      responses: {}
      servers:
        - url: 'http://localhost:3000'
  /rules:
    get:
      summary: get all extract rules
      operationId: get-rules
      parameters:
        - name: sort
          in: query
          description: 'sort key (id|fieldName|value|exactMatch|categoryId)'
          schema:
            type: string
            default: id
        - name: order
          in: query
          description: 'sort order (asc|desc)'
          schema:
            type: string
            default: asc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
      servers:
        - url: 'http://localhost:3000'
    post:
      summary: add extract rule
      operationId: post-rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
      servers:
        - url: 'http://localhost:3000'
  '/rules/{id}':
    get:
      summary: get rule
      operationId: get-rules-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
      servers:
        - url: 'http://localhost:3000'
    delete:
      summary: delete rule
      operationId: delete-rules-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content: {}
      responses:
        '204':
          description: No Content
      servers:
        - url: 'http://localhost:3000'
  /v2/financial-assets/snapshots:
    get:
      summary: 保存済みの取得履歴を一覧で取得（合計と保有商品明細）
      description: >-
        Each item has the same structure as the detail endpoint, including metadata,
        totals and all holdings belonging to that snapshot. Pagination counts snapshots,
        not holdings; a snapshot's holdings are never truncated or split across pages.
        Snapshots are immutable after import. Clients should track processed snapshot IDs.
        Optional from/to select fetchedAt in [from, to); from must precede to when both exist.
        Empty results return an empty items array. Ordering is ascending by fetchedAt then snapshotId.
        Cursors are opaque and valid only with the same source, from, to and page size; they do
        not freeze the result set, and concurrent imports may affect later pages.
      operationId: list-financial-asset-snapshots
      parameters:
        - $ref: '#/components/parameters/Sources'
        - name: from
          in: query
          description: Inclusive fetchedAt boundary, RFC 3339 with timezone.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive fetchedAt boundary, RFC 3339 with timezone.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          schema: { type: string }
      responses:
        '200':
          description: Snapshot page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
      servers:
        - url: 'http://localhost:3000'
  '/v2/financial-assets/snapshots/{snapshotId}':
    get:
      summary: 指定した取得履歴の合計と保有商品明細を取得
      operationId: get-financial-asset-snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Snapshot with holdings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      servers:
        - url: 'http://localhost:3000'
  /v2/financial-assets/balances:
    get:
      summary: 残高または期間推移を取得
      description: >-
        With no time parameters, returns the current single balance. With at, returns
        one historical balance using each source's latest snapshot fetchedAt <= at.
        With from and to, returns daily or monthly points over [from,to) in Asia/Tokyo;
        both dates are required and from must precede to. Period boundaries are clipped
        to the requested range and snapshots must have fetchedAt strictly before each
        period end. interval (default day), limit and cursor are valid only in range mode.
        at cannot be combined with from/to; from/to cannot be combined with interval,
        limit or cursor unless both range dates are provided. Each item has exactly one
        of timestamp (single mode) or periodStart/periodEnd (range mode), with the other
        fields null. Invalid parameter combinations return 400. Schema defaults for interval
        and limit apply only in range mode; omission in single mode is valid.
        Aggregates are null when a requested source/metric is unavailable;
        missingSources lists sources with no eligible snapshot. No total is inferred.
      operationId: get-financial-asset-balances
      parameters:
        - $ref: '#/components/parameters/Sources'
        - name: at
          in: query
          description: RFC 3339 inclusive cutoff; mutually exclusive with from/to.
          schema: { type: string, format: date-time }
        - name: from
          in: query
          description: Inclusive calendar date in Asia/Tokyo; requires to.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Exclusive calendar date in Asia/Tokyo; requires from.
          schema: { type: string, format: date }
        - name: interval
          in: query
          description: Range mode only; day or month.
          schema: { type: string, enum: [day, month], default: day }
        - name: limit
          in: query
          description: Range mode only; page size must match when continuing a cursor.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          description: Range mode only; opaque cursor from the previous page.
          schema: { type: string }
      responses:
        '200':
          description: Balance items and source provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalancePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
      servers:
        - url: 'http://localhost:3000'
components:
  parameters:
    Sources:
      name: source
      in: query
      description: Repeatable source filter. Omit to request both sources.
      schema:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, enum: [sbi, nrkn] }
        default: [sbi, nrkn]
      style: form
      explode: true
  responses:
    BadRequest:
      description: Invalid parameter or incompatible/invalid cursor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Snapshot ID does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InternalError:
      description: Unexpected server failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    import:
      description: /import response
      content:
        application/json:
          schema:
            type: object
            properties:
              useDate:
                type: string
                format: date
                examples:
                  - '2024-06-01'
              name:
                type: string
              registDate:
                type: string
                format: date-time
                examples:
                  - '2024-06-03 15:00:00'
              importJudgeDate:
                type: string
                format: date-time
              importDate:
                type: string
                format: date-time
                examples:
                  - '2024-06-03 15:00:00'
            required:
              - useDate
              - name
              - registDate
              - importJudgeDate
            examples:
              - '2024-06-01'
          examples:
            default:
              value: '2024-06-01'
  schemas:
    ApiError:
      type: object
      properties:
        error: { type: string }
      required: [error]
    DecimalString:
      description: Decimal number encoded as a string. Examples are hand-written synthetic values.
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      example: '100.00'
    NullableDecimal:
      x-go-type: '*string'
      x-go-type-skip-optional-pointer: true
      example: '100.00'
      anyOf:
        - $ref: '#/components/schemas/DecimalString'
        - type: 'null'
    NullableString:
      x-go-type: '*string'
      x-go-type-skip-optional-pointer: true
      anyOf:
        - type: string
        - type: 'null'
    NullableDate:
      x-go-type: '*string'
      x-go-type-skip-optional-pointer: true
      anyOf:
        - type: string
          format: date
        - type: 'null'
    NullableDateTime:
      x-go-type: '*string'
      x-go-type-skip-optional-pointer: true
      anyOf:
        - type: string
          format: date-time
        - type: 'null'
    Totals:
      type: object
      description: >-
        valuationJpy maps SBI grand_total_jpy / NRKN grand_total_jpy. costJpy and
        unrealizedPnlJpy map only NRKN total_cost_jpy and pnl_jpy; SBI values are null.
        Aggregate each field independently and return null if any requested source
        lacks that metric. Never infer a missing value.
      properties:
        valuationJpy: { $ref: '#/components/schemas/NullableDecimal' }
        costJpy: { $ref: '#/components/schemas/NullableDecimal' }
        unrealizedPnlJpy: { $ref: '#/components/schemas/NullableDecimal' }
      required: [valuationJpy, costJpy, unrealizedPnlJpy]
      example:
        valuationJpy: '100.00'
        costJpy: '120.00'
        unrealizedPnlJpy: '-20.00'
    SnapshotPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SnapshotDetail' }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
      required: [items, nextCursor]
    SnapshotSummary:
      type: object
      description: Source totals are represented as decimal strings; null means unavailable.
      properties:
        snapshotId: { type: string, description: Stable opaque globally unique ID for this immutable snapshot. }
        source: { $ref: '#/components/schemas/Source' }
        fetchedAt: { type: string, format: date-time, description: Time source data was fetched. }
        importedAt: { type: string, format: date-time, description: Time this snapshot was imported into the system. }
        totals: { $ref: '#/components/schemas/Totals' }
      required: [snapshotId, source, fetchedAt, importedAt, totals]
    SnapshotDetail:
      allOf:
        - $ref: '#/components/schemas/SnapshotSummary'
        - type: object
          properties:
            holdings:
              type: array
              items: { $ref: '#/components/schemas/Holding' }
          required: [holdings]
    Holding:
      type: object
      description: >-
        holdingId identifies a record within its immutable snapshot, not a product
        across time. Use compositeFigi to group the same identified product across
        snapshots or sources; use the parent snapshot's source and this holding's section as additional
        grouping dimensions when separate holdings are desired. When FIGI is absent,
        productCode can identify products within the same source only; names must not
        be used as product identifiers. Missing/unavailable values
        are null; no values are guessed or derived. valuationJpy maps value_jpy and
        unrealizedPnlJpy maps pnl_jpy in both sources. costJpy maps NRKN cost_jpy;
        SBI costJpy is null. referenceDate maps NRKN reference_date and is null for SBI.
        section maps SBI section and is null for NRKN. productCode maps NRKN product_code
        and is null for SBI. Record IDs are opaque to clients.
      properties:
        holdingId: { type: string }
        section: { $ref: '#/components/schemas/NullableString' }
        productCode: { $ref: '#/components/schemas/NullableString' }
        compositeFigi: { $ref: '#/components/schemas/NullableString' }
        referenceDate: { $ref: '#/components/schemas/NullableDate' }
        name: { type: string }
        quantity: { $ref: '#/components/schemas/NullableDecimal' }
        valuationJpy: { $ref: '#/components/schemas/NullableDecimal' }
        costJpy: { $ref: '#/components/schemas/NullableDecimal' }
        unrealizedPnlJpy: { $ref: '#/components/schemas/NullableDecimal' }
      required: [holdingId, section, productCode, compositeFigi, referenceDate, name, quantity, valuationJpy, costJpy, unrealizedPnlJpy]
    BalancePage:
      type: object
      description: >-
        Always returns items and nullable nextCursor. Single modes return exactly one item;
        range mode emits one point per intersecting calendar period, including periods
        with no data (null totals and missingSources); an exhausted page may be empty.
        nextCursor is null in single mode and on the final range page.
        Sources contains exactly the requested
        sources. missingSources lists only sources with no eligible snapshot, not sources
        whose individual metrics are null. Cursors apply only to range mode and are opaque,
        scoped to sources, from, to, interval and limit; results are not frozen between pages.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BalancePoint' }
        nextCursor: { $ref: '#/components/schemas/NullableString' }
      required: [items, nextCursor]
    BalancePoint:
      type: object
      description: >-
        Exactly one mode is populated. Single mode uses timestamp and null periodStart/periodEnd;
        range mode uses null timestamp and both periodStart/periodEnd. Single mode's timestamp
        is requested at, or current time when omitted. Range values use fetchedAt strictly before
        periodEnd; values carry forward from before the range. Periods are ordered by periodStart.
      properties:
        timestamp: { $ref: '#/components/schemas/NullableDateTime' }
        periodStart: { $ref: '#/components/schemas/NullableDate' }
        periodEnd: { $ref: '#/components/schemas/NullableDate' }
        totals:
          allOf:
            - $ref: '#/components/schemas/Totals'
          example:
            valuationJpy: '123.45'
            costJpy: null
            unrealizedPnlJpy: null
        sources:
          type: array
          items: { $ref: '#/components/schemas/BalanceSource' }
        missingSources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
      required: [timestamp, periodStart, periodEnd, totals, sources, missingSources]
    BalanceSource:
      type: object
      description: >-
        When no eligible snapshot exists, snapshotId and fetchedAt are null and all totals
        fields are null. fetchedAt is when the source data was fetched.
      properties:
        source: { $ref: '#/components/schemas/Source' }
        snapshotId: { $ref: '#/components/schemas/NullableString' }
        fetchedAt: { $ref: '#/components/schemas/NullableDateTime' }
        totals: { $ref: '#/components/schemas/Totals' }
      required: [source, snapshotId, fetchedAt, totals]
    Source:
      type: string
      enum: [sbi, nrkn]
    DetailsCount:
      type: object
      properties:
        count:
          type: integer
          description: total number of details
      required:
        - count
    Detail:
      type: object
      title: Import
      properties:
        id:
          type: integer
        useDate:
          type: string
          format: date
        name:
          type: string
        price:
          type: integer
        registDate:
          type: string
          format: date-time
        importJudgeDate:
          type: string
          format: date-time
        importDate:
          type: string
          format: date-time
      required:
        - id
        - useDate
        - name
        - price
        - registDate
    Rule:
      type: object
      title: ExtractRule
      properties:
        id:
          type: integer
        fieldName:
          type: string
          examples:
            - name
        value:
          type: string
        categoryId:
          type: integer
          examples:
            - 210
        exactMatch:
          type: integer
          minimum: 0
          maximum: 1
      required:
        - id
        - fieldName
        - value
        - categoryId
        - exactMatch
    RuleRequest:
      type: object
      title: ExtractRuleRequest
      properties:
        fieldName:
          type: string
          examples:
            - name
        value:
          type: string
        categoryId:
          type: integer
        exactMatch:
          type: integer
          minimum: 0
          maximum: 1
      required:
        - fieldName
        - value
        - categoryId
        - exactMatch
